name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · type-check · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (core + dev)
        run: python -m pip install -e ".[dev,serve,ui]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: Unit tests
        run: python -m pytest -m "not pipeline" --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  pipeline-smoke:
    name: TFX pipeline smoke (Python 3.10)
    runs-on: ubuntu-latest
    # The TFX 1.14 dependency set is heavy and occasionally flaky to resolve;
    # keep it non-blocking until it has proven stable in CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install (pipeline + dev)
        run: python -m pip install -e ".[pipeline,dev]"

      - name: Pipeline smoke tests
        run: python -m pytest -m pipeline
